[project]
name = "whatsapp-leo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # ── Agent runtime ──
    "openai-agents>=0.6.4",
    "openai>=2.14.0",
    "mcp>=1.11,<2",          # garmin_mcp and our own servers use mcp.server.fastmcp
    "pydantic>=2.0",
    "httpx>=0.27",
    "anyio>=4.0",
    "orjson>=3.10.0",
    "python-dotenv>=1.0",
    # ── Features ──
    "pillow>=11.0",          # image downscaling for the vision model
    "faster-whisper>=1.2.1", # voice-note transcription (CTranslate2, not torch)
    "croniter>=2.0.0",       # briefing / recurring reminder schedules
    "python-dateutil>=2.9.0",
    "gradio>=6.6.0",         # IS_TEST_MODE UI
    # ── x-mcp ──
    "twikit>=2.0",
    "cryptography>=44.0",    # decrypts the browser cookie store during X setup
    "secretstorage>=3.5.0",  # reads the Linux keyring during X setup
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
extend-exclude = ["whatsapp-mcp", ".venv"]

[tool.ruff.lint]
# Pragmatic set: real bugs and imports, not whole-codebase restyling.
select = ["E4", "E7", "E9", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",  # long lines are common in prompts and SQL here
    "B008",  # function calls in defaults are fine for our tool decorators
]

[tool.ruff.lint.per-file-ignores]
# Modules are imported by bare name (agent/ is on sys.path), so import order
# rules would fight the config-must-come-first requirement.
"agent/*.py" = ["I001", "E402"]
"tests/*.py" = ["I001", "E402"]
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.13"
files = ["agent"]
mypy_path = ["agent", "whatsapp-mcp/whatsapp-mcp-server"]
ignore_missing_imports = true
# Advisory for now: the codebase is untyped in places and this is a starting
# point, not a gate. Tighten by removing these as modules get annotated.
check_untyped_defs = false
warn_unused_ignores = true
